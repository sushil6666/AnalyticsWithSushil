name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same PR to keep the queue clean.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
            ci

  lint-yaml:
    name: Lint YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yamllint
      - run: yamllint -f github .

  lint-sql:
    name: Lint SQL (sqlfluff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "sqlfluff==3.*"
      - run: sqlfluff lint models macros --dialect snowflake

  dbt-parse:
    name: dbt parse (structure & syntax check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install dbt-snowflake
      - name: Write a parse-only profile
        # dbt parse never opens a warehouse connection, so these values only
        # need to be well-formed, not real. The actual build/test run against
        # live data happens in the dbt Platform CI job (see README), which
        # holds real credentials centrally instead of in GitHub secrets.
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF'
          dbt_practice:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: ci_placeholder
                user: ci_placeholder
                password: ci_placeholder
                role: ci_placeholder
                warehouse: ci_placeholder
                database: ci_placeholder
                schema: ci_placeholder
                threads: 1
          EOF
      - run: dbt deps
      - run: dbt parse --no-partial-parse

  required-checks:
    name: Required checks summary
    if: always()
    needs: [lint-yaml, lint-sql, dbt-parse]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more required checks failed."
          exit 1
